<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumina — Modern Storefront</title>
  
  <!-- Modern Clean Google Font: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand-group">
        <div class="brand-mark">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <!-- Modern Geometric Bag Emblem -->
            <path d="M16 10V6a4 4 0 0 0-8 0v4"></path>
            <rect x="3" y="9" width="18" height="13" rx="3"></rect>
            <circle cx="12" cy="15.5" r="1.5" fill="currentColor"></circle>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">Lumina</h1>
          <span class="brand-tagline">Studio & Provisions</span>
        </div>
      </div>

      <div class="cart-pill">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span>Cart</span>
        <span class="cart-counter" id="cart-count">0</span>
      </div>
    </div>
  </header>

  <!-- Main Store Layout -->
  <main class="main-layout">
    <!-- Products Catalog Column -->
    <section class="catalog-section">
      <div class="section-header">
        <h2>Products</h2>
        <span class="section-subtitle">Select items to add to your cart</span>
      </div>
      
      <div id="product-list" class="product-grid">
        <!-- Dynamically rendered via dom.js -->
      </div>
    </section>

    <!-- Cart & Summary Column -->
    <section class="cart-section">
      <div class="section-header">
        <h2>Your Cart</h2>
        <span class="section-subtitle">Review items & discounts</span>
      </div>

      <!-- Cart Item Rows Container -->
      <div id="cart-items" class="cart-items-container">
        <!-- Default Empty State -->
        <div class="empty-cart-card">
          <div class="empty-icon-wrap">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="9" cy="21" r="1"></circle>
              <circle cx="20" cy="21" r="1"></circle>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
          </div>
          <h3>Your cart is empty</h3>
          <p>Add items from the product catalog to get started.</p>
        </div>
      </div>

      <!-- Order Summary Card -->
      <div id="cart-summary" class="summary-card">
        <h3 class="summary-title">Order Summary</h3>

        <div class="summary-line">
          <span class="label">Subtotal</span>
          <span class="value" id="summary-subtotal">$0.00</span>
        </div>

        <div class="summary-line discount-line">
          <span class="label">Coupon Discount</span>
          <span class="value" id="summary-discount">-$0.00</span>
        </div>

        <div class="summary-line">
          <span class="label">Estimated Tax (8%)</span>
          <span class="value" id="summary-tax">$0.00</span>
        </div>

        <div class="summary-divider"></div>

        <div class="summary-line total-line">
          <span class="label">Total Payable</span>
          <span class="value total-badge" id="summary-total">$0.00</span>
        </div>

        <!-- Promo Code Form -->
        <div class="coupon-box">
          <label for="coupon-input" class="coupon-label">Have a promo code?</label>
          <div class="coupon-form">
            <input 
              type="text" 
              id="coupon-input" 
              class="coupon-input" 
              placeholder="e.g. SAVE10" 
              autocomplete="off"
            >
            <button type="button" id="apply-coupon-btn" class="btn btn-apply">Apply</button>
          </div>
          <p id="coupon-message" class="coupon-status"></p>
        </div>
      </div>
    </section>
  </main>

  <!-- ES Module Application Entry Point -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
