<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Commerce Order Management</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header>
    <h1>E-Commerce Store</h1>
  </header>

  <main id="app">

    <!-- Product listing — cards injected by ui.js renderProducts() -->
    <section id="product-list">
    </section>

    <!-- Cart + checkout form -->
    <section id="cart-section">
      <h2>Shopping Cart</h2>
      <div id="cart-items"></div>
      <p id="cart-total"></p>

      <form id="checkout-form">
        <input type="text"  id="customer-name"  placeholder="Your Name"  required>
        <input type="email" id="customer-email" placeholder="Your Email" required>
        <button type="submit">Place Order</button>
      </form>
    </section>

    <!-- Order confirmation / error message shown after submit -->
    <section id="order-status"></section>

  </main>

  <!-- type="module" so we can use ES module imports in app.js -->
  <script type="module" src="js/app.js"></script>

</body>
</html>
